name: security-compliance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check repository security files
        run: |
          python3 -m pip install 'PyYAML==6.0.2'
          python3 .github/security/check_baseline.py --profile code
